<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Shop — public ledger</title>
<style>
  :root { --bg:#0b0e14; --card:#131722; --line:#232a3b; --text:#e8edf6; --dim:#8b94a7; --blue:#316dca; }
  body { margin:0; font-family: ui-sans-serif, system-ui, sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  a { color: var(--blue); text-decoration: none; }
  h1 { font-size: 24px; margin: 8px 0 4px; }
  .sub { color: var(--dim); font-size: 14px; margin-bottom: 20px; }
  .stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 20px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; text-align: center; }
  .stat b { display: block; font-size: 20px; }
  .stat span { color: var(--dim); font-size: 12px; }
  @media (max-width:600px){ .stats { grid-template-columns: repeat(2,1fr);} }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--dim); font-weight: 500; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  td { padding: 8px 6px; border-bottom: 1px solid var(--line); }
  .tag { font-size: 11px; padding: 2px 6px; border-radius: 6px; background: #1f6feb33; color: #6cb0ff; }
  .tag.sim { background: #8e6c0a33; color: #e3b341; }
  .mono { font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<div class="wrap">
  <a href="/">← back to shop</a>
  <h1>Public ledger</h1>
  <p class="sub">Every order the agent has processed — amounts, AI inference cost, revenue splits, and payouts. Nothing hidden.</p>
  <div class="stats">
    <div class="stat"><b id="n">0</b><span>orders</span></div>
    <div class="stat"><b id="rev">$0.00</b><span>revenue</span></div>
    <div class="stat"><b id="cost">$0.00</b><span>inference cost</span></div>
    <div class="stat"><b id="sim">0</b><span>simulated</span></div>
  </div>
  <table>
    <thead><tr><th>Order</th><th>Topic</th><th>Amount</th><th>Owner</th><th>Contrib.</th><th>Reserve</th><th>Type</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<script>
  fetch('/api/ledger').then(r => r.json()).then(({entries}) => {
    const orders = entries.filter(e => e.order_id && e.status !== 'rejected');
    document.getElementById('n').textContent = orders.length;
    document.getElementById('rev').textContent = '$' + orders.reduce((s,e)=>s+(e.amount_usd||0),0).toFixed(2);
    document.getElementById('cost').textContent = '$' + orders.reduce((s,e)=>s+(e.inference_cost_usd||0),0).toFixed(3);
    document.getElementById('sim').textContent = orders.filter(e=>e.simulated).length;
    document.getElementById('rows').innerHTML = orders.slice().reverse().map(e => `
      <tr>
        <td class="mono">${e.order_id}</td>
        <td>${(e.topic||'').slice(0,48)}</td>
        <td>$${(e.amount_usd||0).toFixed(2)}</td>
        <td>$${(e.owner_share||0).toFixed(2)}</td>
        <td>$${(e.contributors_share||0).toFixed(2)}</td>
        <td>$${(e.reserve||0).toFixed(2)}</td>
        <td><span class="tag ${e.simulated?'sim':''}">${e.simulated?'DEMO':'REAL'}</span></td>
      </tr>`).join('');
  });
</script>
</body>
</html>
