<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Shop — buy a research report</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; background: #0d1117; color: #e6edf3; }
    input, button { font-size: 16px; padding: 10px; border-radius: 8px; }
    input { width: 100%; box-sizing: border-box; background: #161b22; color: #e6edf3; border: 1px solid #30363d; }
    button { background: #238636; color: white; border: 0; cursor: pointer; margin-top: 12px; width: 100%; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; margin-top: 20px; }
    .mono { font-family: monospace; word-break: break-all; background: #0d1117; padding: 8px; border-radius: 6px; }
    pre { white-space: pre-wrap; }
    .status { font-weight: bold; }
  </style>
</head>
<body>
  <h1>🛒 Research Shop</h1>
  <p>Pay with crypto (NEAR Intents / 1Click) — get an AI research report.</p>
  <div class="card">
    <label>What should we research?</label><br><br>
    <input id="topic" placeholder="e.g. Current adoption of NEAR Intents">
    <button onclick="buy()">Buy report — $8.00</button>
    <button onclick="buy(true)" style="background:#1f6feb">Try demo (simulated, no payment)</button>
  </div>
  <div class="card" id="payCard" style="display:none">
    <h3>Send exactly <span id="amt"></span></h3>
    <p>To this address:</p>
    <div class="mono" id="addr"></div>
    <p>Order: <span id="oid"></span> — status: <span class="status" id="status">awaiting payment</span></p>
  </div>
  <div class="card" id="errCard" style="display:none">
    <h3>⚠️ Something went wrong</h3>
    <pre id="err" style="color:#f85149"></pre>
  </div>
  <div class="card" id="reportCard" style="display:none">
    <h3>📄 Your report</h3>
    <pre id="report"></pre>
  </div>
  <script>
    let orderId = null;
    function showError(msg) {
      document.getElementById('errCard').style.display = 'block';
      document.getElementById('err').textContent = msg;
    }
    async function buy(demo = false) {
      document.getElementById('errCard').style.display = 'none';
      const topic = document.getElementById('topic').value.trim();
      if (!topic) return alert('Enter a topic');
      let r, o;
      try {
        r = await fetch('/api/order', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({topic, amount_usd: 8.0, demo})
        });
        o = await r.json();
      } catch (e) {
        return showError('Network error: ' + e + ' — if this site is on Vercel, check that Deployment Protection is disabled so the API is reachable.');
      }
      if (!r.ok) {
        return showError('API error ' + r.status + ': ' + JSON.stringify(o).slice(0, 300) +
          (r.status === 401 ? ' — deployment is protected by Vercel Authentication; disable it in Vercel → Settings → Deployment Protection.' : ''));
      }
      if (o.simulated) {
        document.getElementById('reportCard').style.display = 'block';
        document.getElementById('report').textContent = o.report;
        document.getElementById('status').textContent = 'success (simulated)';
        return;
      }
      orderId = o.order_id;
      document.getElementById('payCard').style.display = 'block';
      document.getElementById('amt').textContent = '$' + (o.amount_in_usd || '8.00');
      document.getElementById('addr').textContent = o.deposit_address;
      document.getElementById('oid').textContent = orderId;
      poll();
    }
    async function poll() {
      const r = await fetch('/api/order/' + orderId);
      const o = await r.json();
      document.getElementById('status').textContent = o.status;
      if (o.status === 'success') {
        document.getElementById('reportCard').style.display = 'block';
        document.getElementById('report').textContent = o.report;
        return;
      }
      setTimeout(poll, 5000);
    }
  </script>
</body>
</html>
